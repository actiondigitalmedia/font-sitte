name: Weekly project backup

on:
  schedule:
    - cron: "30 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create backup tarball
        run: python3 scripts/backup_project.py

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: font-sitte-backup-${{ github.run_id }}
          path: |
            backups/font-sitte_*.tar.gz
            backups/font-sitte_*/manifest.json
          retention-days: 90
