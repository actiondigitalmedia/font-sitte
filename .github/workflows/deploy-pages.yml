name: Build and Deploy Pages

on:
  push:
    branches:
      - main
      - cursor/seo-strategy-plans-d92e
      - cursor/free-font-aggregation-43e3
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r free-font-site/requirements.txt

      # Catalog JSON is committed — skip live aggregate/enrich for reliable deploys.
      # Weekly schedule can re-run with FETCH=1 via workflow_dispatch inputs later.
      - name: Build SEO static site
        run: |
          python3 free-font-site/scripts/build_web_catalog.py
          python3 free-font-site/scripts/build_site.py
          python3 free-font-site/scripts/verify_seo.py
        env:
          SITE_URL: https://actiondigitalmedia.github.io/font-sitte

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: free-font-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
