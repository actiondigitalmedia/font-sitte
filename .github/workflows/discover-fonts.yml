name: Weekly font discovery report

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: free-font-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Aggregate from cache (if present)
        run: python3 scripts/aggregate.py --no-fetch || true
      - name: Run discovery diff
        run: python3 scripts/discover_fonts.py
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: font-discovery-report
          path: free-font-site/discovery/reports/*.json
          if-no-files-found: warn
